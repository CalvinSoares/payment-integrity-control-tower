services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-integrity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_integrity}
      POSTGRES_USER: ${POSTGRES_USER:-integrity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integrity_dev}
    ports:
      - "5438:5432"
    volumes:
      - integrity-postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integrity} -d ${POSTGRES_DB:-payment_integrity}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  integrity-postgres-data:
